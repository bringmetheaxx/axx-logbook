<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áxil's Logbook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="flex-section">
    <!-- Left side: Log Form and Entries -->
    <div class="log-section">
        <!-- Existing Log Form -->
        <form id="logForm">
            <textarea id="logEntry" placeholder="Escreva entrada..." required></textarea>
            <button type="submit">Adicionar entrada</button>
        </form>

        <!-- Existing Log Entries -->
        <div id="logEntries">
            <h2>Recent Entries:</h2>
            <table id="entryTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Hour</th>
                        <th>Entry</th>
                    </tr>
                </thead>
                <tbody id="entryList">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Right side: Structured Table -->
    <div class="schedule-section">
        <h2>Rondas</h2>
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>Dia</th>
                    <th colspan="4">Ronda 1</th>
                    <th colspan="3">Ronda 2</th>
                    <th colspan="5">Ronda 3</th>
                </tr>
                <tr>
                    <th></th>
                    <th>Início</th><th>Galinhas</th><th>Lixo</th><th>Retorno</th>
                    <th>Início</th><th>CIN</th><th>Retorno</th>
                    <th>Início</th><th>Lixo</th><th>Galinhas</th><th>CIN</th><th>Retorno</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
