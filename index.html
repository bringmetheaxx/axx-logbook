<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áxil's Logbook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Áxil's Logbook</h1>

        <div class="flex-section">
            <!-- Log Entry Section -->
            <div class="log-section">
                <!-- Log Entry Form -->
                <form id="logForm">
                    <textarea id="logEntry" placeholder="Escreva entrada..." required></textarea>
                    <button type="submit">Adicionar entrada</button>
                </form>

                <!-- Search Input -->
                <div id="searchSection">
                    <input type="text" id="searchInput" placeholder="Filtrar entradas..." />
                </div>

                <!-- Display Log Entries -->
                <div id="logEntries">
                    <h2>Entradas recentes:</h2>
                    <table id="entryTable">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Hora</th>
                                <th>Entrada</th>
                            </tr>
                        </thead>
                        <tbody id="entryList">
                            <!-- Entries populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Schedule Table Section -->
            <div class="schedule-section">
                <h2>Rondas</h2>
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th>Dia</th>
                            <th colspan="4">Ronda 1</th>
                            <th colspan="3">Ronda 2</th>
                            <th colspan="5">Ronda 3</th>
                        </tr>
                        <tr>
                            <th></th>
                            <th>Início</th><th>Galinhas</th><th>Lixo</th><th>Retorno</th>
                            <th>Início</th><th>CIN</th><th>Retorno</th>
                            <th>Início</th><th>Lixo</th><th>Galinhas</th><th>CIN</th><th>Retorno</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                        <tr contenteditable="true">
                            <td>03/04</td>
                            <td>02:00</td><td>02:12</td><td>02:23</td><td>02:28</td>
                            <td>04:00</td><td>Ñ sei</td><td>04:18</td>
                            <td>06:07</td><td>-</td><td>06:19</td><td>06:34</td><td>06:38</td>
                        </tr>
                    </tbody>
                </table>
                <button id="addRowBtn">+ Add Row</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
